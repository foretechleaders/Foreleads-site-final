# Netlify build configuration for Foreleads Leadership Consulting LLC

[build]
  # Replace checked-in node_modules with dependencies for the build platform.
  command = "npm ci --include=dev && npm run build"
  publish = "dist"
  base = "."

[build.environment]
  NODE_VERSION = "18.16.0"

# Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
